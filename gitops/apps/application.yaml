apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ubi8-minimal-app-dev
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/salanisor/openshift-pipelines.git
    targetRevision: main
    path: gitops/apps/ubi8-minimal-app/overlays/dev
  
  destination:
    server: https://kubernetes.default.svc
    namespace: pipelines-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ubi8-minimal-app-prod
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/salanisor/openshift-pipelines.git
    targetRevision: main
    path: gitops/apps/ubi8-minimal-app/overlays/prod
  
  destination:
    server: https://kubernetes.default.svc
    namespace: pipelines-prod
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
  
  revisionHistoryLimit: 10
