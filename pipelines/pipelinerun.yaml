    #       storageClassName: local-filesystem
    #       accessModes:
    #         - ReadWriteOnce
    #       resources:
    #         requests:
    #           storage: 1Gi
    # - name: workspace-jboss
    #   emptyDir: {}
  workspaces:
    - name: workspace-build
      persistentVolumeClaim:
        claimName: pipeline-pvc
