apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: base-image-config-pipeline
  namespace: pipelines
spec:
  workspaces:
  - name: workspace-build
  params:
  - name: image-tag
    type: string
    description: version of the newly built image
  - name: URL
    type: string
    description: url of the git repo for the code of deployment
    default: https://github.com/redhat-developer-demos/qotd.git
  - name: IMAGE
    type: string
    description: image to be built from the code
    default: quay.apps.ocp4.keights.org/openshift/base-images:ubi8-minimal-latest
  - name: git-revision
    type: string
    description: revision to be used from repo of the code for deployment
    default: main
  - name: TLS_VERIFY
    type: string
    description: Sets the TLS verification flag, `true` is recommended.
  tasks:
  - name: git-clone
    taskRef:
      resolver: cluster
      params:
      - name: namespace
        value: openshift-pipelines
      - name: kind
        value: task
      - name: name
        value: git-clone
    params:
    - name: URL
      value: $(params.URL)
    - name: subdirectory
      value: ""
    - name: deleteExisting
      value: "false"
    - name: REVISION
      value: $(params.git-revision)
    workspaces:
    - name: output
      workspace: workspace-build
  - name: buildah-bud-and-push
    runAfter:
      - git-clone
    taskRef:
      resolver: cluster
      params:
      - name: namespace
        value: openshift-pipelines
      - name: kind
        value: task
      - name: name
        value: buildah
    params:
      - name: IMAGE
        value: $(params.IMAGE):$(params.image-tag)
      - name: BUILDER_IMAGE
        value: >-
          registry.redhat.io/rhel9/buildah
      - name: STORAGE_DRIVER
        value: vfs
      - name: DOCKERFILE
        value: 'jboss-image-builder/Dockerfile'
      - name: CONTEXT
        value: .
      - name: TLS_VERIFY
        value: $(params.TLS_VERIFY)
      - name: FORMAT
        value: oci
      - name: BUILD_EXTRA_ARGS
        value: ''
      - name: PUSH_EXTRA_ARGS
        value: ''
      - name: SKIP_PUSH
        value: 'false'
    workspaces:
      - name: source
        workspace: workspace-build
