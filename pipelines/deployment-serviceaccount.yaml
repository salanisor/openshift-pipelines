# deploy-sa.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-sa
  namespace: pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-role
  namespace: pipelines
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-rb
  namespace: pipelines
subjects:
- kind: ServiceAccount
  name: deploy-sa
  namespace: pipelines
roleRef:
  kind: Role
  name: deploy-role
  apiGroup: rbac.authorization.k8s.io
